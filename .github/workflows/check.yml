name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S runtime -B build/runtime -A Win32
      - run: cmake --build build/runtime --config Release --parallel
      - run: ctest --test-dir build/runtime -C Release --output-on-failure
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_no_game_content.py --all
