name: Package setup preview
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (no release is published)
        required: true
        default: 0.2.1
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: microsoft/setup-msbuild@v2
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements.lock
      - run: python tools/check_no_game_content.py --all
      - run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -v
      - run: |
          cmake -S runtime -B build/runtime -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/runtime --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/runtime -C Release --output-on-failure
      - name: Build pinned SafeDiscLoader2
        run: |
          $pin = Get-Content packaging/dependencies.json -Raw | ConvertFrom-Json
          git clone $pin.safedisc.repository build/safedisc-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build/safedisc-source checkout --detach $pin.safedisc.commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $props = (Resolve-Path packaging/static-runtime.props).Path
          msbuild build/safedisc-source/version-proxy.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:ForceImportBeforeCppTargets=$props /m:1 /nr:false
      - name: Package with licenses and corresponding source
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.2.1' }}
        run: python tools/package_setup.py --version "$env:PACKAGE_VERSION" --safedisc-source build/safedisc-source --safedisc-dll build/safedisc-source/Release/version.dll --runtime build/runtime/bin/Release/dinput8.dll
      - name: Smoke test frozen helper
        run: |
          $folder = Get-ChildItem build/package-*/frozen/muac-setup/muac-setup.exe | Select-Object -First 1
          & $folder.FullName --version
      - uses: actions/upload-artifact@v4
        with:
          name: muac-setup-package
          path: dist/*
