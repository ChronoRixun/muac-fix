[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muac-fix"
version = "0.2.3"
description = "Setup and compatibility kit for the 2006 PC release of Marvel: Ultimate Alliance, installed from your own disc"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pycdlib==1.22.0"]
license = "GPL-3.0-only"
license-files = ["LICENSE", "licenses/*.txt"]
keywords = ["marvel-ultimate-alliance", "compatibility", "installer", "xinput", "openspy"]

[project.urls]
Homepage = "https://github.com/ChronoRixun/muac-fix"
Source = "https://github.com/ChronoRixun/muac-fix"
Issues = "https://github.com/ChronoRixun/muac-fix/issues"
Releases = "https://github.com/ChronoRixun/muac-fix/releases"

[project.scripts]
muac-setup = "muac_setup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
